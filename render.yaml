services:
  - type: web
    name: chessmotion-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://chessmotion.vercel.app
      - key: PYTHON_VERSION
        value: 3.11.0
