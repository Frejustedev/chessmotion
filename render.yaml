services:
  # ── Backend (FastAPI + Stockfish) ─────────────────────────────────────────────
  - type: web
    name: chessmotion-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://chessmotion-frontend.onrender.com
      - key: PYTHON_VERSION
        value: "3.11"

  # ── Frontend (Next.js Static Export) ─────────────────────────────────────────
  - type: web
    name: chessmotion-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: out
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://chessmotion-backend.onrender.com
